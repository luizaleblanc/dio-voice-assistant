spring.application.name=budgeting
spring.datasource.url=jdbc:mysql://localhost:3307/transaction?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=8000

logging.level.org.springframework.ai=DEBUG
